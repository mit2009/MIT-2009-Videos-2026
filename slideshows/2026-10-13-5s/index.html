<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>MIT 2.009 · October 13 Lecture · 5 seconds per photo</title>
    <link rel="stylesheet" href="style.css" />
    <script src="photos.js" defer></script>
    <script src="slideshow.js" defer></script>
  </head>
  <body>
    <main id="slideshow" aria-label="MIT 2.009 photo slideshow">
      <img class="slide" alt="" aria-hidden="true" />
      <img class="slide" alt="" aria-hidden="true" />
    </main>
    <div id="controls" role="group" aria-label="Slideshow controls">
      <button id="previous" type="button" aria-label="Previous photograph" title="Previous photograph (←)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7" /></svg>
      </button>
      <button id="play" type="button" aria-label="Pause slideshow" title="Pause slideshow (Space)">
        <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" /></svg>
        <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z" /></svg>
      </button>
      <button id="next" type="button" aria-label="Next photograph" title="Next photograph (→)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5 7 7-7 7" /></svg>
      </button>
      <button id="fullscreen" type="button" aria-label="Enter full screen" title="Enter full screen (F)">
        <svg class="enter-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5" /></svg>
        <svg class="exit-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h5V4m6 0v5h5M9 20v-5H4m11 5v-5h5" /></svg>
      </button>
    </div>
    <p id="status" role="status" hidden></p>
    <noscript><p class="notice">Enable JavaScript to play this slideshow.</p></noscript>
  </body>
</html>
